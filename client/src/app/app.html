@switch (session.phase()) {
  @case ('loading') {
    <main class="loading">
      <span class="brand-mark">p</span>
      <p>Opening your conversations…</p>
      <app-theme-toggle />
    </main>
  }
  @case ('auth') {
    <app-auth-page />
  }
  @case ('phone') {
    <app-phone-setup-page />
  }
  @case ('chat') {
    <app-chat-page />
  }
}
